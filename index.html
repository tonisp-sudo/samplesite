<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundation Test | Tonis Praks Universe</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            syne: ['Syne', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
            body: ['DM Sans', 'sans-serif']
          },
          colors: {
            base: {
              DEFAULT: '#0b0c0a',
              light: '#121212',
              card: '#1a1a1a'
            },
            text: {
              DEFAULT: '#f0f0f0',
              muted: '#a0a0a0'
            },
            border: 'rgba(240, 240, 240, 0.1)',
            accent: {
              DEFAULT: '#6366f1',  // Indigo accent
              light: '#818cf8',
              dark: '#4f46e5'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Site CSS -->
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="bg-base text-text">
  <!-- Custom cursor elements -->
  <div id="c-dot"></div>
  <div id="c-ring"></div>
  
  <!-- Particle background container -->
  <div id="p5-wrap"></div>
  
  <!-- Navigation (Shared Partial) -->
  <div id="nav-container">
    <!-- Content will be injected by JavaScript -->
  </div>
  
  <main class="min-h-screen">
    <!-- Page content will go here -->
    <div class="container mx-auto py-20 text-center">
      <h1 class="text-4xl font-syne font-bold mb-4">Foundation Test</h1>
      <p class="text-text-muted max-w-md mx-auto">
        This is a test of the theme foundation. Navigation, footer, and background
        should be visible.
      </p>
    </div>
  </main>
  
  <!-- Footer (Shared Partial) -->
  <div id="footer-container">
    <!-- Content will be injected by JavaScript -->
  </div>
  
  <!-- Scripts -->
  <script>
    // Load partials
    document.addEventListener('DOMContentLoaded', function() {
      // Load navigation
      fetch('partials/nav.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('nav-container').innerHTML = html;
        });
      
      // Load footer
      fetch('partials/footer.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('footer-container').innerHTML = html;
        });
    });
  </script>
</body>
</html>
